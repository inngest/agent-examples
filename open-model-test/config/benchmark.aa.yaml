# Δ4 (spec v3 §14): thinking-mode A/A sanity run. The same M3 endpoint is
# entered twice — thinking off vs on — over a small task slice with k=2 and
# no baseline. The output decides the one pinned `thinking` value for every
# real run (off = fairer latency/cost comparison, on = fairer capability
# comparison); the decision is recorded and disclosed, never varied silently.
#
#   BENCHMARK_CONFIG=config/benchmark.aa.yaml bun run benchmark

run:
  k_samples: 2
  seed_policy: vary
  # Small slice across both axes (tier × task_type) — enough signal to
  # decide, cheap enough to throw away.
  tasks: [go-t1-001, go-t2-001, go-t3-001, go-fileops-t2-001]

models:
  - id: minimax-m3-fp8-nebius
    adapter: openai_compat
    endpoint: ${NEBIUS_BASE_URL}
    api_key_env: NEBIUS_API_KEY
    model: MiniMaxAI/MiniMax-M3 # Δ1-confirmed (2026-08-21)
    concurrency: 4
    params: { temperature: 0.2, top_p: 0.95, max_tokens: 8192, thinking: false }
    pricing: # Δ2-pinned 2026-08-21 (Nebius rate card — see benchmark.yaml)
      input_per_mtok: 0.30
      output_per_mtok: 1.20

  # Same endpoint, same params — only the thinking bit differs. The -thinking
  # suffix keeps the two variants distinct in every result row and the
  # dashboard; it is NOT the pinned identity for real runs.
  - id: minimax-m3-fp8-nebius-thinking
    adapter: openai_compat
    endpoint: ${NEBIUS_BASE_URL}
    api_key_env: NEBIUS_API_KEY
    model: MiniMaxAI/MiniMax-M3
    concurrency: 4
    params: { temperature: 0.2, top_p: 0.95, max_tokens: 8192, thinking: true }
    pricing: # Δ2-pinned 2026-08-21 (Nebius rate card — see benchmark.yaml)
      input_per_mtok: 0.30
      output_per_mtok: 1.20

prompting:
  system: "You are a Go coding assistant. Return code changes only."
  user_suffix: |
    Write the complete contents of {entrypoint}. Put the code in a single fenced code block. Do not include any other files.

sandbox:
  runner: local
  default_timeout_seconds: 60
